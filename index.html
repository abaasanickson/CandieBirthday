<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Candie ❤️</title>
    <link rel="stylesheet" href="style.css?v=5">
</head>

<body>
    <main class="intro-screen">

        <div id="stars"></div>

        <div id="countdown" class="countdown">
            <span id="countdownNumber">3</span>
        </div>

        <div id="happy" class="birthday-text hidden">
            HAPPY
        </div>

        <div id="birthday" class="birthday-text hidden">
            BIRTHDAY
        </div>

        <div id="heartStage" class="heart-stage hidden">
            <div class="heart-message">
                <span>♡</span>
            </div>
        </div>

        <section id="greetingStage" class="greeting-stage hidden">

            <div class="greeting-content">

                <p class="greeting-label">
                    A SPECIAL DAY FOR SOMEONE SPECIAL
                </p>

                <h1>
                    HAPPY<br>
                    BIRTHDAY
                </h1>

                <div class="greeting-name-wrap">
                    <h2 class="greeting-name">Ms. Elsie</h2>
                    <span class="greeting-heart">♥</span>
                </div>

                <p class="greeting-message">
                    To my beautiful Candie,
                    may your day be filled with love,
                    happiness and beautiful memories.
                </p>

            </div>

            <div class="cake-container">
                <div class="cake-glow"></div>

                <img
                    src="assets/images/cake_extracted.png"
                    alt="Candie's birthday cake"
                    class="cake-image"
                >
            </div>

            <button class="next-button" id="nextButton">
                <span>OUR MEMORIES</span>
                <span class="button-heart">♡</span>
            </button>

        </section>

    </main>

    <script src="script.js?v=6"></script>
</body>
</html>
